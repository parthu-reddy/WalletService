apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: food-delivery/wallet-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8096
          envFrom:
            - configMapRef:
                name: advertisement-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
