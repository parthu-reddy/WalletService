apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: food-delivery/wallet-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8120
          envFrom:
            - configMapRef:
                name: advertisement-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8120
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8120
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
